server:
  port: 8080

spring:
  application:
    name: socialweb-backend
  datasource:
    url: jdbc:h2:file:./data/socialweb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ss
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "socialweb-demo-secret-key-please-change-in-prod-0123456789abcdef"
    expire-days: 7

logging:
  level:
    root: info
    # 打印每个进入的 HTTP 请求（如 POST /api/auth/register）
    org.springframework.web: debug
